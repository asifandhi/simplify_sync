<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Symplify-Sync Chat Background Pattern</title>
<style>
  /* ===== COLOR TOKENS — Change these to retheme ===== */
  :root{
    --stroke:#448DFD;
    --stroke-width:1.6;
    --fill:#448DFD;
    --bg:#ffffff;
    --curve:#9ec5fd;
    --curve-width:1.2;
    --filler-opacity:0.5;
    --pin-hole:#ffffff;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);display:flex;align-items:center;justify-content:center;min-height:100vh;}
  svg.pattern{width:100%;max-width:1020px;}
  .ico{fill:none;stroke:var(--stroke);stroke-width:var(--stroke-width);stroke-linecap:round;stroke-linejoin:round;}
  .fillIco{fill:var(--fill);stroke:none;}
  .dot{fill:var(--stroke);stroke:none;}
  .logotext{font-family:Arial,Helvetica,sans-serif;font-weight:600;font-size:11px;fill:var(--stroke);}
  .curve{fill:none;stroke:var(--curve);stroke-width:var(--curve-width);stroke-dasharray:3 4;stroke-linecap:round;}
  .filler{opacity:var(--filler-opacity);}
</style>
</head>
<body>
<svg class="pattern" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
<defs>
  <!-- 1. filled map pin -->
  <g id="pin">
    <path class="fillIco" d="M0,-14 C6.5,-14 11,-9.5 11,-4 C11,4 0,14 0,14 C0,14 -11,4 -11,-4 C-11,-9.5 -6.5,-14 0,-14 Z"/>
    <circle cx="0" cy="-4" r="3.2" fill="var(--pin-hole)"/>
  </g>
  <!-- 2. phone plain -->
  <g id="phonePlain">
    <rect class="ico" x="-7" y="-14" width="14" height="28" rx="2.5"/>
  </g>
  <!-- 3. phone dotted signal -->
  <g id="phoneDots">
    <rect class="ico" x="-7" y="-14" width="14" height="28" rx="2.5"/>
    <line class="ico" stroke-dasharray="1.5 2.5" x1="0" y1="-8" x2="0" y2="8"/>
  </g>
  <!-- 4. phone double arrow -->
  <g id="phoneArrows">
    <rect class="ico" x="-9" y="-16" width="18" height="32" rx="3"/>
    <path class="ico" d="M-4,0 h8 M1,-3 l3,3 l-3,3 M-1,-3 l-3,3 l3,3"/>
  </g>
  <!-- 5. laptop sync -->
  <g id="laptopSync">
    <path class="ico" d="M-15,-12 h30 v15 h-30 Z"/>
    <path class="ico" d="M-21,3 h42 l-3.5,6 h-35 Z"/>
    <circle class="ico" cx="0" cy="-4.5" r="5.5"/>
    <path class="ico" d="M3.8,-7.2 A5.5,5.5 0 1 1 -2.5,-9.5"/>
    <path class="ico" d="M2.8,-9.3 l1,2.1 l2,-1"/>
  </g>
  <!-- 6. laptop arrows -->
  <g id="laptopArrows">
    <path class="ico" d="M-15,-12 h30 v15 h-30 Z"/>
    <path class="ico" d="M-21,3 h42 l-3.5,6 h-35 Z"/>
    <path class="ico" d="M-5,-4.5 h10 M2,-7.5 l3,3 l-3,3 M-2,-7.5 l-3,3 l3,3"/>
  </g>
  <!-- 7. monitor circular arrows -->
  <g id="monitorCircular">
    <rect class="ico" x="-17" y="-13" width="34" height="21" rx="2"/>
    <path class="ico" d="M-4,13 h8 M0,8 v5"/>
    <path class="ico" d="M5,-3.5 A6,6 0 0 0 -3.5,-8.5 M-5,3.5 A6,6 0 0 0 3.5,8.5" transform="translate(0,-4) scale(0.9)"/>
    <path class="ico" d="M4,-9 l2,1.3 l-.6,2.2 M-4,9 l-2,-1.3 l.6,-2.2" transform="translate(0,-4) scale(0.9)"/>
  </g>
  <!-- 8. monitor straight arrows -->
  <g id="monitorStraight">
    <rect class="ico" x="-17" y="-13" width="34" height="21" rx="2"/>
    <path class="ico" d="M-4,13 h8 M0,8 v5"/>
    <path class="ico" d="M-6,-2.5 h12 M3,-5.5 l3,3 l-3,3 M-3,-5.5 l-3,3 l3,3"/>
  </g>
  <!-- 9. monitor wifi -->
  <g id="monitorWifi">
    <rect class="ico" x="-17" y="-13" width="34" height="21" rx="2"/>
    <path class="ico" d="M-4,13 h8 M0,8 v5"/>
    <path class="ico" d="M-8,-6 A11,11 0 0 1 8,-6"/>
    <path class="ico" d="M-5,-3 A7,7 0 0 1 5,-3"/>
    <circle class="dot" cx="0" cy="-1" r="1.4"/>
  </g>
  <!-- 10. wifi -->
  <g id="wifi">
    <path class="ico" d="M-11,-2 A16,16 0 0 1 11,-2"/>
    <path class="ico" d="M-7,3 A10,10 0 0 1 7,3"/>
    <path class="ico" d="M-3,8 A5,5 0 0 1 3,8"/>
    <circle class="dot" cx="0" cy="9" r="1.6"/>
  </g>
  <!-- 11. cloud bidirectional -->
  <g id="cloudBi">
    <path class="ico" d="M-11,6 A7,7 0 0 1 -9,-7 A9,9 0 0 1 8,-9 A7,7 0 0 1 11,6 Z"/>
    <path class="ico" d="M0,-5 v12 M-3,-2 l3,-3 l3,3 M-3,4 l3,3 l3,-3"/>
  </g>
  <!-- 12. cloud up -->
  <g id="cloudUp">
    <path class="ico" d="M-11,6 A7,7 0 0 1 -9,-7 A9,9 0 0 1 8,-9 A7,7 0 0 1 11,6 Z"/>
    <path class="ico" d="M0,5 v-10 M-3,-2 l3,-3 l3,3"/>
  </g>
  <!-- 13. circle right arrow -->
  <g id="circleArrow">
    <circle class="ico" cx="0" cy="0" r="11"/>
    <path class="ico" d="M-4,0 h9 M2,-4 l4,4 l-4,4"/>
  </g>
  <!-- 14. circle target -->
  <g id="circleTarget">
    <circle class="ico" cx="0" cy="0" r="6"/>
    <circle class="dot" cx="0" cy="0" r="1.6"/>
    <path class="ico" d="M4,-4 l4,-4"/>
  </g>
  <!-- 15. sync loop -->
  <g id="syncLoop">
    <path class="ico" d="M9,0 A9,9 0 1 1 5,-7.8"/>
    <path class="ico" d="M9,-5 L9,0 L4,0"/>
  </g>
  <!-- 16. dashed ring -->
  <g id="dashedRing">
    <circle class="ico" stroke-dasharray="2.5 3.5" cx="0" cy="0" r="9"/>
  </g>
  <!-- 17. chain link -->
  <g id="chainLink">
    <rect class="ico" x="-11" y="-6" width="12" height="12" rx="6" transform="rotate(-30 -5 0)"/>
    <rect class="ico" x="-1" y="-6" width="12" height="12" rx="6" transform="rotate(-30 5 0)"/>
  </g>
  <!-- 18. share node -->
  <g id="shareNode">
    <circle class="ico" cx="-7" cy="-7" r="2.2"/>
    <circle class="ico" cx="-7" cy="7" r="2.2"/>
    <circle class="ico" cx="7" cy="0" r="2.2"/>
    <path class="ico" d="M-5,-6 L5,-1.5 M-5,6 L5,1.5"/>
  </g>
  <!-- 19. chevrons -->
  <g id="chevronRight"><path class="ico" d="M-7,-6 L-1,0 L-7,6 M-1,-6 L5,0 L-1,6"/></g>
  <g id="chevronLeft"><path class="ico" d="M7,-6 L1,0 L7,6 M1,-6 L-5,0 L1,6"/></g>
  <!-- 20. dot grids -->
  <g id="dotGrid">
    <circle class="dot" cx="-5" cy="-5" r="1.5"/><circle class="dot" cx="5" cy="-5" r="1.5"/>
    <circle class="dot" cx="-5" cy="5" r="1.5"/><circle class="dot" cx="5" cy="5" r="1.5"/>
  </g>
  <g id="dotGrid3">
    <circle class="dot" cx="-4" cy="-4" r="1.2"/><circle class="dot" cx="0" cy="-4" r="1.2"/><circle class="dot" cx="4" cy="-4" r="1.2"/>
    <circle class="dot" cx="-4" cy="0" r="1.2"/><circle class="dot" cx="0" cy="0" r="1.2"/><circle class="dot" cx="4" cy="0" r="1.2"/>
    <circle class="dot" cx="-4" cy="4" r="1.2"/><circle class="dot" cx="0" cy="4" r="1.2"/><circle class="dot" cx="4" cy="4" r="1.2"/>
  </g>
  <!-- 21. fillers -->
  <g id="plus"><path class="ico" stroke-width="1.3" d="M0,-4 v8 M-4,0 h8"/></g>
  <g id="circleHollow"><circle class="ico" stroke-width="1.2" cx="0" cy="0" r="4.5"/></g>
  <g id="diamond"><path class="ico" stroke-width="1.2" d="M0,-4 L4,0 L0,4 L-4,0 Z"/></g>
  <!-- 22. logo badge -->
  <g id="logoBadge">
    <circle class="ico" cx="0" cy="0" r="11"/>
    <path class="ico" d="M6,-5 A7,7 0 0 0 -6,3"/>
    <path class="ico" d="M6,-8 L6,-5 L3,-5"/>
    <path class="ico" d="M-6,5 A7,7 0 0 0 6,-3"/>
    <path class="ico" d="M-6,8 L-6,5 L-3,5"/>
    <text x="-3.5" y="4" font-family="Arial" font-weight="700" font-size="10" fill="var(--stroke)">S</text>
  </g>
  <!-- 23. arrows -->
  <g id="arrowR"><path class="ico" stroke-width="1.3" d="M-5,0 h10 M2,-3 l3,3 l-3,3"/></g>
  <g id="arrowL"><path class="ico" stroke-width="1.3" d="M5,0 h-10 M-2,-3 l-3,3 l3,3"/></g>
  <g id="arrowU"><path class="ico" stroke-width="1.3" d="M0,5 v-10 M-3,-2 l3,-3 l3,3"/></g>
  <g id="arrowD"><path class="ico" stroke-width="1.3" d="M0,-5 v10 M-3,2 l3,3 l3,-3"/></g>
  <!-- 24. NAVIGATION / DIRECTION ARROW (compass style) -->
  <g id="navArrow">
    <!-- <path class="fillIco" d="M0,-13 L-7,11 L0,4 Z" opacity="0.9"/> -->
    <path class="ico" stroke-width="1.4" d="M0,-13 L-7,11 L0,4 L7,11 Z"/>
  </g>
  <!-- 25. small nav arrow (rotated variations placed inline) -->
  <g id="navArrowSmall">
    <path class="fillIco" d="M0,-9 L-5,7 L0,2 Z" opacity="0.8"/>
    <path class="ico" stroke-width="1.2" d="M0,-9 L-5,7 L0,2 L5,7 Z"/>
  </g>
</defs>
